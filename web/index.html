<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c29">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; base-uri 'none'; object-src 'none'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <title>Na Trasie</title>
</head>
<body>
  <header class="top">
    <div class="masthead">
      <div class="brand"><span class="brand-icon" aria-hidden="true"><span></span></span><div><h1>Na Trasie</h1><p>Warszawa</p></div></div>
      <button id="source-button" class="status" type="button" aria-label="Stan i źródła danych"><span id="status-dot" class="status-dot"></span><span id="status">Ładowanie</span></button>
    </div>
    <form id="search" role="search">
      <span class="magnifier" aria-hidden="true"></span>
      <input id="line-query" type="search" aria-label="Numer linii" placeholder="Wpisz numer linii, np. 175" autocomplete="off" maxlength="12" enterkeyhint="search">
      <button type="submit">Szukaj</button>
    </form>
    <nav class="filters" aria-label="Rodzaj pojazdów">
      <button type="button" data-mode="all" aria-pressed="true">Wszystkie</button><button type="button" data-mode="bus" aria-pressed="false"><span class="swatch bus"></span>Autobusy</button><button type="button" data-mode="tram" aria-pressed="false"><span class="swatch tram"></span>Tramwaje</button>
    </nav>
  </header>
  <main class="workspace">
    <section class="map-wrap" aria-label="Mapa pojazdów">
      <div id="map"></div>
      <div id="map-note" class="map-note" role="status" hidden></div>
      <div class="map-tools">
        <button type="button" id="zoom-in" aria-label="Powiększ mapę">+</button>
        <button type="button" id="zoom-out" aria-label="Pomniejsz mapę">−</button>
        <button type="button" id="recenter" aria-label="Wyśrodkuj mapę na Warszawie">◎</button>
      </div>
    </section>
    <section class="panel" aria-label="Linie i pojazdy">
      <div class="panel-head">
        <h2 id="panel-title">Pojazdy na mapie</h2>
        <button id="toggle-favorites" type="button" aria-expanded="false"><span aria-hidden="true">☆</span> Ulubione</button>
      </div>
      <div id="panel-content" aria-live="polite">
        <p class="panel-placeholder">Pobieranie pozycji pojazdów…</p>
      </div>
      <footer><span id="feed-time">Oczekiwanie na dane</span><button id="refresh" type="button">Odśwież <span aria-hidden="true">↻</span></button></footer>
    </section>
  </main>
  <dialog id="sources">
    <h2>Dane o pojazdach</h2>
    <p id="source-date">Oczekiwanie na dane</p>
    <p>Pozycje GPS udostępnia <a href="https://api.um.warszawa.pl/">Miasto Stołeczne Warszawa</a>. Dane w formacie GTFS-RT dostarcza <a href="https://mkuran.pl/gtfs/">Mikołaj Kuranowski</a>.</p>
    <form method="dialog"><button type="submit">Zamknij</button></form>
  </dialog>
</body>
</html>
